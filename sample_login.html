<!DOCTYPE html>
<html lang="ar">
<head>
    
    
    <meta charset="UTF-8">
    
    <link rel="stylesheet" href="sample_login.css">
    
    <style>
        .form input, label {
            margin: 10px;
            display: block;
        }
    </style>
    
    <script type="text/javascript" src="sample_login.js" defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
    (function(){
        emailjs.init("d3oDpvpHsE4_0H-dq");
  })();
    </script>


    
    <title>Kazuma TV/LOG IN</title>
    
    
</head>
<body>
    
    
    <form id="signupForm" class="signup-form">
        <label for="nameInput">رجاءاً إصنع إسم مستخدم: </label>
        <input type="text" id="nameInput" pattern="[A-Za-z0-9_]{3, 16}" placeholder="مثال: Ali_2002" required>
        <label for="emailInput">رجاءاً أدخل عنوان بريدك الإلكتروني: </label>
        <input type="email" id="emailInput" placeholder="مثال: example@gmail.com" required>
        <label for="passwordInput">رجاءاً إصنع كلمة مرور: </label>
        <input type="password" id="passwordInput" required placeholder="مثال: 123456" pattern="[A-Za-z0-9$]{6, 16}">
        <label for="repeatPasswordInput">رجاءاً أكِّد كلمة مرورك: </label>
        <input type="password" id="repeatPasswordInput" required>
        <button type="submit" class="send-code">إنشاء حساب</button> <div>لديك حساب بالفعل؟<button id="loginRedirectBtn">سجِّل الدخول</button></div>
    </form>
    
    
    
    <form id="loginForm" class="login-form">
        <label for="emailLogInput">رجاءاً أدخل عنوان بريدك الإلكتروني: </label>
        <input type="email" id="emailLogInput" required>
        <label for="passwordLogInput">رجاءاً أدخل كلمة مرورك: </label>
        <input type="password" id="passwordLogInput" required>
        <button type="submit" >تسجيل الدخول</button> <div>أنت جديد هنا؟ <button id="signupRedirectBtn">أنشئ حساباً</button></div>
        <div>هل نسيت كلمة مرورك؟<button id="forgotPasswordBtn" class="send-code">إضغط هنا</button></div>
    </form>
    
    
    
    <form id="verificationForm" class="verification-form">
        <input type="number" id="verificationInput" placeholder="رجاءاً أدخل رمز التأكيد">
        <button id="resendCodeBtn" class="send-code">إعادة الإرسال</button>
        <button type="submit">إنشاء حساب</button>
    </form>
    
    
    
    <form id="forgotPasswordForm" class="forgot-password-form">
      
      <input type="number" id="forgotPasswordInput" placeholder="أدخل رمز التأكيد...">
      <button type="submit">تأكيد</button>
      <button id="resendForgotPasswordCodeBtn">تأكيد</button
        
    </form>
    
    
    
    <form id="changePasswordForm" class="change-password-form">
      
      <input id="changePasswordInput" type="password" placeholder="غَيِّر كلمة مرورك...">
      <button type="submit">تغيير كلمة المرور</button>
        
    </form>
    
    <p id="message"></p>
    
</body>
</html>
